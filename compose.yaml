# Somente desenvolvimento local. Produção usa outro arquivo, com segredos fora do Git.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_dev_local
      POSTGRES_DB: nexo_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nexo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexo_pgdata:
